<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 목록</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --text: #1f2328;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-soft: #eff4ff;
            --border: #e5e7eb;
            --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
                "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }

        header {
            margin-bottom: 32px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .projects {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 14px;
        }

        .projects li {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .projects li:hover {
            transform: translateY(-2px);
            border-color: #cdd6e4;
            box-shadow: 0 4px 10px rgba(15, 23, 42, .08), 0 14px 32px rgba(15, 23, 42, .08);
        }

        .projects a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            color: inherit;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .projects a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 14px;
        }

        .icon {
            flex: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 1.1rem;
        }

        .label {
            flex: 1;
        }

        .arrow {
            flex: none;
            color: var(--muted);
            transition: transform .15s ease, color .15s ease;
        }

        .projects a:hover .arrow {
            transform: translateX(4px);
            color: var(--accent);
        }

        footer {
            margin-top: 40px;
            color: var(--muted);
            font-size: .92rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .wrap {
                padding: 40px 18px 56px;
            }

            header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>프로젝트 목록</h1>
            <p>제가 만든 프로젝트들을 모았습니다. 카드를 눌러 살펴보세요.</p>
        </header>

        <ul class="projects">
            <li>
                <a href="https://2026-09-28.github.io/apple-store/">
                    <span class="icon" aria-hidden="true">&#128717;</span>
                    <span class="label">애플 스토어</span>
                    <span class="arrow" aria-hidden="true">&rarr;</span>
                </a>
            </li>
            <li>
                <a href="https://2026-09-28.github.io/card-generator/">
                    <span class="icon" aria-hidden="true">&#127183;</span>
                    <span class="label">카드</span>
                    <span class="arrow" aria-hidden="true">&rarr;</span>
                </a>
            </li>
            <li>
                <a href="https://2026-09-28.github.io/book/">
                    <span class="icon" aria-hidden="true">&#128214;</span>
                    <span class="label">동화책</span>
                    <span class="arrow" aria-hidden="true">&rarr;</span>
                </a>
            </li>
        </ul>

        <footer>2026 &middot; My Projects</footer>
    </div>
</body>

</html>
